name: Build with Docker and Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-app .

      - name: Extract Build Files from Docker
        run: |
          docker create --name temp_container my-app
          docker cp temp_container:/var/www/html ./build_output
          docker rm temp_container

      - name: Clean unwanted folders from build_output
        run: |
          rm -rf ./build_output/vendor
          rm -rf ./build_output/writable
          rm -rf ./build_output/storage
          rm -rf ./build_output/brain
          rm -rf ./build_output/.github
          rm -rf ./build_output/.git
          rm -f ./build_output/.gitignore
          rm -f ./build_output/.gitattributes
          rm -f ./build_output/.env*

      - name: Prepare Zip Package
        run: |
          mkdir ./deploy_pkg
          # Copy extraction script
          cp deploy_unzip.php ./deploy_pkg/
          # Zip the build_output directory into deploy.zip
          cd ./build_output
          zip -r ../deploy_pkg/deploy.zip .
          cd ..

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./deploy_pkg/
          protocol: ftp
          port: 21

      - name: Trigger Remote Unzip
        run: |
          # Replace with your actual domain or IP address where public/deploy_unzip.php is accessible
          curl -sS "https://riskoninsurance.com/deploy_unzip.php?token=riskon_deploy_secret_2026" || curl -sS "http://72.60.216.54/deploy_unzip.php?token=riskon_deploy_secret_2026"